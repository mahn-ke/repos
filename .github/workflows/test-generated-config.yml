name: Test protected generated configuration

on:
  pull_request:
    paths: ['tools/**', 'infrastructure/modules/general/**', '.github/workflows/test-generated-config.yml']
  push:
    branches: [main]
    paths: ['tools/**', 'infrastructure/modules/general/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tools/generated-config*.test.mjs