name: Adopt protected generated configuration state

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahn-ke/repos-infrastructure-state
  cancel-in-progress: false

jobs:
  adopt:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Adopt GDQ staged file identities without deleting files
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          while IFS= read -r assignment; do
            export "${assignment?}"
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$SECRETS_CONTEXT")
          export PGDATABASE=repos-infrastructure
          export GH_TOKEN="$TF_VAR_GITHUB_PAT"
          export ADOPT_GENERATED_STATE=true
          node tools/generated-config-delivery.mjs prepare
          terraform -chdir=infrastructure init -input=false
          node tools/generated-config-delivery.mjs adopt-state